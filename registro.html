<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Usuario</title>


<style>
    
/* CONFIGURACIÓN GENERAL */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: #e5f8e9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 25px;
}

/* FORMULARIO */
.formulario {
    background: white;
    padding: 35px;
    border-radius: 25px;
    width: 420px;
    max-width: 100%;
    box-shadow: 0 8px 0 #d0e8d5,
                0 12px 30px rgba(0,0,0,0.08);
    border: 2px solid #e5f1e7;
}

/* TÍTULO */
.formulario h2 {
    text-align: center;
    color: #58cc02;
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 30px;
}

/* CAMPOS */
input {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 15px 0;
    border: 2px solid #e5e5e5;
    border-radius: 14px;
    background: #f7f7f7;
    font-size: 15px;
    color: #333;
    outline: none;
    transition: all 0.2s;
}

/* CUANDO SE SELECCIONA UN CAMPO */
input:focus {
    border-color: #58cc02;
    background: white;
    box-shadow: 0 0 0 3px rgba(88,204,2,0.12);
}

/* PLACEHOLDER */
input::placeholder {
    color: #999;
}

/* BOTÓN */
button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    background: #58cc02;
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 0 #46a302;
    transition: all 0.15s;
}

/* EFECTO DEL BOTÓN */
button:hover {
    background: #61df00;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #46a302;
}

/* MENSAJES */
#mensaje {
    margin-top: 20px;
    padding: 12px;
    text-align: center;
    font-weight: bold;
    border-radius: 12px;
    color: #389600;
}

/* RESPONSIVE */
@media (max-width: 480px) {

    .formulario {
        padding: 25px 20px;
    }

    .formulario h2 {
        font-size: 25px;
    }

    input {
        padding: 13px;
    }

}

</style>


</head>
<body>


<div class="formulario">
    <h2>Registro Usuario</h2>


    <form id="formRegistro">
        <input type="text" name="nombre" placeholder="Nombre" required>


        <input type="email" name="email" placeholder="Correo electrónico" required>


        <input type="password" name="contraseña" maxlength="6" placeholder="Contraseña" required>


        <input type="date" name="fecha_nac" required>


        <input type="text" name="pais" placeholder="País" required>


        <input type="number" name="nivel" min="1" max="99" placeholder="Nivel" required>


        <button type="submit">Registrarse</button>
    </form>


    <div id="mensaje"></div>
</div>


<script>
document.getElementById("formRegistro")
.addEventListener("submit", async function(e){


    e.preventDefault();


    const datos = {
        nombre: this.nombre.value,
        email: this.email.value,
        contraseña: this.contraseña.value,
        fecha_nac: this.fecha_nac.value,
        pais: this.pais.value,
        nivel: this.nivel.value
    };


    try{


        const respuesta = await fetch("registro.php",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify(datos)
        });


        const resultado = await respuesta.json();


        document.getElementById("mensaje").innerHTML =
        resultado.mensaje;


        if(resultado.estado){
            this.reset();
        }


    }catch(error){
        console.error(error);
    }


});
</script>


</body>
</html>
